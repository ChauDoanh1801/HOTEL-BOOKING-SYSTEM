<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Booking Khách Sạn</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Firebase JS SDK (v9 Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 700; }
        .past-day { background-color: #f1f5f9 !important; color: #94a3b8; }
        .past-card { opacity: 0.55; filter: grayscale(100%); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- TOP NAVIGATION BAR -->
    <header id="mainHeader" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-hotel text-blue-600 text-2xl"></i>
                <span class="font-extrabold text-lg tracking-wide text-slate-900">BOOKING MANAGEMENT SYSTEM</span>
            </div>

            <!-- TABS -->
            <nav class="flex gap-8 font-medium text-slate-600 text-sm">
                <button onclick="switchMainTab('booking')" id="nav-booking" class="tab-btn active py-2">
                    <i class="fa-solid fa-calendar-check mr-1.5"></i> Booking
                </button>
                <button onclick="switchMainTab('management')" id="nav-management" class="tab-btn py-2">
                    <i class="fa-solid fa-list-check mr-1.5"></i> Quản Lý
                </button>
                <button onclick="switchMainTab('settings')" id="nav-settings" class="tab-btn py-2">
                    <i class="fa-solid fa-sliders mr-1.5"></i> Cài Đặt
                </button>
            </nav>

            <!-- USER INFO & LOGOUT -->
            <div class="flex items-center gap-3 text-sm">
                <span class="bg-slate-100 px-3 py-1 rounded-full font-semibold text-slate-700" id="userInfoDisplay">
                    <i class="fa-solid fa-user-circle text-blue-600 mr-1"></i> Admin
                </span>
                <button onclick="logout()" class="text-red-600 hover:text-red-700 font-semibold text-xs border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-50 transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER CHÍNH -->
    <main class="max-w-7xl mx-auto p-4 md:p-6">

        <!-- ==================== TAB 1: BOOKING ==================== -->
        <div id="tab-booking" class="tab-page space-y-6">
            
            <!-- 1. Dropdown chọn Tên Khách Sạn & Nút Import OTA -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <label class="font-bold text-slate-700 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-building text-blue-600"></i> Chọn Khách Sạn Làm Việc:
                    </label>
                    <select id="bookingHotelSelect" class="border border-slate-300 rounded-xl p-2.5 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 w-72">
                        <option value="hotel_default">Khách Sạn Mặc Định</option>
                    </select>
                </div>

                <!-- NÚT IMPORT FILE OTA -->
                <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold cursor-pointer inline-flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-file-import"></i>
                    <span>Import File Agoda/OTA</span>
                    <input type="file" id="otaInputFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="processOTAFile(event)">
                </label>
            </div>

            <!-- 2. Khu vực Tạo Booking Mới -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-blue-600"></i> Tạo Booking Mới
                </h2>
                <form id="createBookingForm" onsubmit="handleCreateBooking(event)" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 text-xs">
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Mã Booking *</label>
                        <input type="text" id="bkCode" required class="w-full border rounded-lg p-2 text-sm" placeholder="BK001">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Loại Phòng *</label>
                        <select id="bkRoomType" required class="w-full border rounded-lg p-2 text-sm">
                            <option value="Standard">Standard</option>
                            <option value="Deluxe">Deluxe</option>
                            <option value="VIP">VIP</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Tên Khách *</label>
                        <input type="text" id="bkGuestName" required class="w-full border rounded-lg p-2 text-sm" placeholder="Nguyễn Văn A">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Nguồn Booking</label>
                        <select id="bkSource" class="w-full border rounded-lg p-2 text-sm">
                            <option value="Agoda">Agoda</option>
                            <option value="Booking.com">Booking.com</option>
                            <option value="Airbnb">Airbnb</option>
                            <option value="Trực Tiếp / Zalo">Trực Tiếp / Zalo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Check-in *</label>
                        <input type="date" id="bkCheckin" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Check-out *</label>
                        <input type="date" id="bkCheckout" required class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Tổng Tiền (VNĐ)</label>
                        <input type="number" id="bkTotal" class="w-full border rounded-lg p-2 text-sm" placeholder="2000000">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-600">Trạng Thái *</label>
                        <select id="bkStatus" required class="w-full border rounded-lg p-2 text-sm">
                            <option value="Xác nhận">Xác nhận</option>
                            <option value="Đã cọc">Đã cọc</option>
                            <option value="Hoàn thành">Hoàn thành</option>
                        </select>
                    </div>
                    <div class="md:col-span-4 flex justify-end mt-2">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl transition text-sm">
                            <i class="fa-solid fa-plus mr-1"></i> Tạo Booking Mới
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB QUẢN LÝ & CÀI ĐẶT RÚT GỌN... -->
        <div id="tab-management" class="tab-page hidden">
            <div class="bg-white p-6 rounded-2xl border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800">Quản Lý Booking</h2>
            </div>
        </div>

        <div id="tab-settings" class="tab-page hidden">
            <div class="bg-white p-6 rounded-2xl border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800">Cài Đặt Hệ Thống</h2>
            </div>
        </div>

    </main>

    <!-- SCRIPT CHÍNH ĐÃ FIX LỖI IMPORT AGODA VÀ SAI NODE FIREBASE -->
    <script>
        // --- 1. Cấu hình Firebase (Thay thông số của bạn tại đây) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Khởi tạo Firebase nếu chưa khởi tạo
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // --- 2. Hàm chuyển đổi Tab ---
        function switchMainTab(tabName) {
            document.querySelectorAll('.tab-page').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        // --- 3. Hàm tạo Booking thủ công (Lưu ĐÚNG NODE theo Hotel ID) ---
        function handleCreateBooking(event) {
            event.preventDefault();
            const hotelId = document.getElementById('bookingHotelSelect').value;

            if (!hotelId) {
                alert("Vui lòng chọn khách sạn trước khi tạo booking!");
                return;
            }

            const bookingData = {
                code: document.getElementById('bkCode').value.trim(),
                roomType: document.getElementById('bkRoomType').value,
                guestName: document.getElementById('bkGuestName').value.trim(),
                source: document.getElementById('bkSource').value,
                checkin: document.getElementById('bkCheckin').value,
                checkout: document.getElementById('bkCheckout').value,
                totalPrice: Number(document.getElementById('bkTotal').value) || 0,
                status: document.getElementById('bkStatus').value,
                createdAt: new Date().toISOString()
            };

            // FIX: Lưu đúng node theo Khách Sạn -> 'bookings/{hotelId}'
            firebase.database().ref(`bookings/${hotelId}`).push(bookingData)
                .then(() => {
                    alert("Tạo Booking thành công!");
                    document.getElementById('createBookingForm').reset();
                })
                .catch(err => alert("Lỗi khi lưu vào Firebase: " + err.message));
        }

        // --- 4. HÀM XỬ LÝ IMPORT FILE AGODA/OTA (ĐÃ FIX ĐỌC DATA & ĐÚNG NODE) ---
        function processOTAFile(event) {
            const file = event.target.files[0];
            const hotelId = document.getElementById('bookingHotelSelect').value;

            if (!file) return;
            if (!hotelId) {
                alert("Vui lòng chọn Khách Sạn trước khi Import file!");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });

                    // Đọc trang đầu tiên của file Excel
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];

                    // FIX LỖI 1: Chuyển sheet thành dạng Objects để nhận diện Tên Cột (Header)
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (!jsonRows || jsonRows.length === 0) {
                        alert("File Excel Agoda/OTA không chứa dữ liệu!");
                        return;
                    }

                    let importedCount = 0;
                    const updates = {};

                    jsonRows.forEach((row, index) => {
                        // Tìm khóa linh hoạt tương ứng với định dạng Agoda, Booking.com, Airbnb
                        const bookingCode = findValueByKey(row, ['Booking ID', 'Booking Reference', 'ID Booking', 'Mã booking', 'Reference']) || `AGD-${Date.now()}-${index}`;
                        const guestName = findValueByKey(row, ['Guest Name', 'Customer Name', 'Tên khách', 'Khách hàng', 'Guest']) || 'Khách Agoda';
                        const checkin = parseDateValue(findValueByKey(row, ['Check-in', 'Arrival date', 'Checkin', 'Ngày đến']));
                        const checkout = parseDateValue(findValueByKey(row, ['Check-out', 'Departure date', 'Checkout', 'Ngày đi']));
                        const totalAmount = parseNumberValue(findValueByKey(row, ['Total Amount', 'Total Price', 'Total', 'Giá tiền', 'Doanh thu', 'Amount']));
                        const roomType = findValueByKey(row, ['Room Type', 'Loại phòng', 'Room']) || 'Standard';

                        // Chỉ import nếu có dữ liệu hợp lệ
                        if (bookingCode && guestName) {
                            const newBookingKey = firebase.database().ref(`bookings/${hotelId}`).push().key;
                            
                            // Cấu trúc Booking chuẩn
                            const bookingData = {
                                code: String(bookingCode).trim(),
                                guestName: String(guestName).trim(),
                                roomType: String(roomType).trim(),
                                checkin: checkin,
                                checkout: checkout,
                                totalPrice: totalAmount,
                                source: 'Agoda / OTA',
                                status: 'Xác nhận',
                                importedAt: new Date().toISOString()
                            };

                            // FIX LỖI 2: Đưa vào đúng Node path `bookings/{hotelId}/{key}`
                            updates[`bookings/${hotelId}/${newBookingKey}`] = bookingData;
                            importedCount++;
                        }
                    });

                    // Đẩy đồng loạt dữ liệu lên Firebase Database
                    if (importedCount > 0) {
                        firebase.database().ref().update(updates)
                            .then(() => {
                                alert(`Đã Import thành công ${importedCount} Booking từ Agoda vào hệ thống!`);
                                event.target.value = '';
                            })
                            .catch(err => {
                                alert("Lỗi khi cập nhật dữ liệu Firebase: " + err.message);
                            });
                    } else {
                        alert("Không tìm thấy dữ liệu Booking hợp lệ trong file Agoda!");
                    }

                } catch (err) {
                    console.error("Lỗi xử lý file Excel:", err);
                    alert("Không thể đọc file Excel/Agoda này: " + err.message);
                }
            };

            reader.readAsArrayBuffer(file);
        }

        // --- 5. BỘ HÀM BỔ TRỢ ĐỌC ĐỊNH DẠNG FILE AGODA DỄ DÀNG ---

        // Hàm tìm giá trị trong dòng bằng nhiều từ khóa header khác nhau
        function findValueByKey(rowObject, possibleKeys) {
            const keys = Object.keys(rowObject);
            for (let pKey of possibleKeys) {
                const foundKey = keys.find(k => k.trim().toLowerCase() === pKey.toLowerCase());
                if (foundKey && rowObject[foundKey] !== undefined && rowObject[foundKey] !== "") {
                    return rowObject[foundKey];
                }
            }
            return null;
        }

        // Hàm định dạng Ngày Checkin/Checkout về chuẩn YYYY-MM-DD
        function parseDateValue(val) {
            if (!val) return new Date().toISOString().split('T')[0];
            if (val instanceof Date) return val.toISOString().split('T')[0];
            
            const d = new Date(val);
            if (!isNaN(d.getTime())) {
                return d.toISOString().split('T')[0];
            }
            return String(val);
        }

        // Hàm định dạng số tiền
        function parseNumberValue(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            const cleaned = String(val).replace(/[^0-9.-]+/g, "");
            return Number(cleaned) || 0;
        }
    </script>
</body>
</html>
